name: Channel analytics

on:
  schedule:
    # Times are UTC. 07:23 Oslo in winter, every day.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopilot   # shared with the video jobs, so saves never clash
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Collect views and subscribers
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
        run: python -m autopilot.analytics

      - name: Save analytics for the dashboard
        run: |
          git config user.name "story-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/analytics.json
          git diff --cached --quiet || git commit -m "Update channel analytics"
          git pull --rebase --quiet || true
          git push
