<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --ink:#1d1b17; --muted:#6f6a5f; --line:#e2dccf;
  --ok:#1f8a5b; --warn:#c77a12; --bad:#c23b2e; --idle:#8a8577; --accent:#2b4cd8;
  --ok-bg:#e3f3ea; --warn-bg:#fbefd9; --bad-bg:#f8e1de; --idle-bg:#ece9e1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13130f; --panel:#1c1b17; --ink:#efeadf; --muted:#9a9486; --line:#2e2c26;
    --ok:#4cc38a; --warn:#e6a23c; --bad:#ef6a5b; --idle:#7d786b; --accent:#7f97ff;
    --ok-bg:#16301f; --warn-bg:#352a14; --bad-bg:#3a1b17; --idle-bg:#262520;
  }
}
:root[data-theme="dark"]{
  --bg:#13130f; --panel:#1c1b17; --ink:#efeadf; --muted:#9a9486; --line:#2e2c26;
  --ok:#4cc38a; --warn:#e6a23c; --bad:#ef6a5b; --idle:#7d786b; --accent:#7f97ff;
  --ok-bg:#16301f; --warn-bg:#352a14; --bad-bg:#3a1b17; --idle-bg:#262520;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font-size:clamp(26px,5vw,38px);margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.banner{background:var(--warn-bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .n{font-size:30px;font-weight:700;font-family:"JetBrains Mono",monospace}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.agent{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.agent-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.agent h2{margin:0;font-size:20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-posted,.s-idle-ok{color:var(--ok);background:var(--ok-bg)}
.s-partial,.s-running,.s-dry{color:var(--warn);background:var(--warn-bg)}
.s-failed,.s-paused{color:var(--bad);background:var(--bad-bg)}
.s-idle{color:var(--idle);background:var(--idle-bg)}
.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:6px}
.strip{display:flex;gap:4px;margin:16px 0 6px;flex-wrap:wrap}
.day{width:14px;height:22px;border-radius:3px;background:var(--idle-bg);border:1px solid var(--line)}
.day.posted{background:var(--ok);border-color:var(--ok)}
.day.partial,.day.dry{background:var(--warn);border-color:var(--warn)}
.day.failed{background:var(--bad);border-color:var(--bad)}
.legend{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.t{max-width:380px}
.err{color:var(--bad);font-size:12px;margin-top:3px}
a{color:var(--accent)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.tablewrap{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 4px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .n{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:600}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.chan{font-size:13px;color:var(--muted);margin-top:4px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.chart{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:6px}
.chart-title{text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.chart-head .mono{color:var(--ink);font-size:15px;font-weight:600}
.chart .gain{color:var(--c);font-size:12px;margin-left:4px}
.chart svg{width:100%;height:90px;display:block}
.chart .line{fill:none;stroke:var(--c);stroke-width:2}
.chart .area{fill:var(--c);opacity:.12}
.chart-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.chart-empty{font-size:12px;color:var(--muted);padding:28px 0;text-align:center}
td.num{text-align:right;font-family:"JetBrains Mono",monospace}
th.num{text-align:right}
.top{font-size:13px;margin-top:8px}
@media (max-width:700px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .charts{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Agent Control Room</h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <div class="sub mono" id="clock"></div>
  </header>
  <div id="banner"></div>
  <section class="kpis" id="kpis"></section>
  <section id="agents"></section>
</div>

<script>
const DEMO = {
  updated: new Date().toISOString(),
  agents: { "stories-1": {
    id:"stories-1", name:"Daily Stories", kind:"video", platforms:["youtube","tiktok"], state:"idle",
    consecutive_failures:0, schedule:"Daily 16:41 Oslo", last_run:new Date(Date.now()-36e5).toISOString(), totals:{videos:12,youtube:12,tiktok:11,failures:1},
    runs: Array.from({length:12},(_,i)=>{
      const d=new Date(Date.now()-i*864e5); const failed=i===5;
      return {started:d.toISOString(), finished:d.toISOString(), seconds:180+i*3,
        result: failed?"failed":(i===2?"partial":"posted"),
        title: ["The Lighthouse Keeper Who Never Left","The Plane That Landed 37 Years Late","She Heard Knocking From Inside the Wall","The Man Who Survived Two Atomic Bombs"][i%4],
        genre:"demo", video:{duration:58.4},
        posted: failed?{}:{youtube:{url:"#"}, ...(i===2?{}:{tiktok:{mode:"inbox",status:"SEND_TO_USER_INBOX"}})},
        errors: i===2?["TikTok: access_token_invalid"]:undefined,
        error: failed?"Pexels: no usable footage found":undefined};
    })
  }}
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = iso => { if(!iso) return "never"; const m=Math.round((Date.now()-new Date(iso))/6e4);
  return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"; };
const fmt = iso => iso ? new Date(iso).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
const cls = r => ({posted:"posted",partial:"partial","dry run":"dry",failed:"failed"}[r]||"idle");

const num = n => n==null ? "—" : n>=1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,"")+"M" : n>=1e4 ? Math.round(n/1e3)+"k" : n>=1e3 ? (n/1e3).toFixed(1).replace(/\.0$/,"")+"k" : String(n);

function chart(history, agentId, key, label, color){
  const pts = (history||[]).map(h=>({t:new Date(h.time).getTime(), v:h.agents?.[agentId]?.[key]})).filter(p=>p.v!=null);
  const head = `<div class="chart-head"><span class="chart-title">${label}</span>`;
  if(pts.length<2) return `<div class="chart">${head}<span class="mono">—</span></div><div class="chart-empty">Builds up as stats are collected every 3 hours</div></div>`;
  const W=300,H=90,P=4,t0=pts[0].t,t1=pts[pts.length-1].t;
  const vmin=Math.min(...pts.map(p=>p.v)), vmax=Math.max(...pts.map(p=>p.v)), span=Math.max(1,vmax-vmin);
  const xy = pts.map(p=>[((p.t-t0)/Math.max(1,t1-t0))*W, H-P-((p.v-vmin)/span)*(H-2*P)]);
  const line = xy.map(([x,y],i)=>(i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)).join(" ");
  const gain = pts[pts.length-1].v - pts[0].v;
  const day = d => new Date(d).toLocaleDateString([], {month:"short", day:"numeric"});
  return `<div class="chart" style="--c:${color}">${head}<span class="mono">${num(pts[pts.length-1].v)} <span class="gain">${gain>=0?"+":""}${num(gain)}</span></span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${label}: from ${pts[0].v} to ${pts[pts.length-1].v}">
      <path class="area" d="${line} L${W} ${H} L0 ${H} Z"/><path class="line" d="${line}" vector-effect="non-scaling-stroke"/></svg>
    <div class="chart-axis"><span>${day(t0)}</span><span>${day(t1)}</span></div></div>`;
}

function charts(history, agentId){
  return `<div class="charts">${chart(history, agentId, "views", "Views over time", "var(--accent)")}${chart(history, agentId, "subscribers", "Subscribers over time", "var(--ok)")}</div>`;
}

function render(data, demo, stats){
  $("#banner").innerHTML = demo ? '<div class="banner">Showing <b>demo data</b>. Real runs appear here once the daily job has run on GitHub.</div>' : "";
  $("#updated").textContent = "Last update " + ago(data.updated) + (stats?.updated ? " · YouTube stats " + ago(stats.updated) : "");
  const agents = Object.values(data.agents || {});
  const sum = k => agents.reduce((a,x)=>a+(x.totals?.[k]||0),0);
  const active = agents.filter(a=>a.state!=="paused").length;
  const sAgents = Object.values(stats?.agents||{});
  const totalViews = stats ? sAgents.reduce((a,x)=>a+(x.views||0),0) : null;
  const subsKnown = sAgents.filter(x=>x.channel?.subscribers!=null);
  const totalSubs = subsKnown.length ? subsKnown.reduce((a,x)=>a+x.channel.subscribers,0) : null;
  $("#kpis").innerHTML = [
    ["Agents active", `${active}/${agents.length}`],["YouTube posts", sum("youtube")],
    ["Total views", num(totalViews)],["Subscribers", num(totalSubs)]
  ].map(([l,n])=>`<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");

  if(!agents.length){ $("#agents").innerHTML='<div class="empty">No agents have reported yet. Run the workflow once from the Actions tab.</div>'; return; }

  $("#agents").innerHTML = agents.map(a=>{
    const runs = a.runs||[];
    const last = runs[0];
    const stateCls = a.state==="paused"?"s-paused":a.state==="running"?"s-running":"s-idle";
    const days = runs.slice(0,30).reverse().map(r=>`<div class="day ${cls(r.result)}" title="${esc(fmt(r.started))} · ${esc(r.result)}"></div>`).join("");
    const st = stats?.agents?.[a.id];
    const rows = runs.slice(0,15).map(r=>{
      const yt = r.posted?.youtube?.url ? `<a href="${esc(r.posted.youtube.url)}" target="_blank" rel="noopener">YouTube</a>` : "";
      const tk = r.posted?.tiktok ? (r.posted.tiktok.mode==="inbox"?"TikTok inbox":"TikTok") : "";
      const v = stats?.videos?.[r.posted?.youtube?.id];
      const errs = [r.error, ...(r.errors||[])].filter(Boolean).map(e=>`<div class="err">${esc(e)}</div>`).join("");
      return `<tr><td class="mono">${esc(fmt(r.started))}</td>
        <td class="t">${esc(r.title||"—")}${errs}</td>
        <td><span class="pill s-${cls(r.result)}">${esc(r.result)}</span></td>
        <td class="num">${v ? (v.missing ? "removed" : num(v.views)) : "—"}</td>
        <td class="num hide-sm">${v && !v.missing ? num(v.likes) : "—"}</td>
        <td class="hide-sm">${[yt,tk].filter(Boolean).join(" · ")||"—"}</td>
        <td class="mono hide-sm">${r.video?.duration?r.video.duration+"s":"—"}</td></tr>`;
    }).join("");
    const ch = st?.channel || {};
    const statsBlock = st ? `
      <div class="stats">
        <div class="stat"><div class="n">${num(ch.subscribers)}</div><div class="l">Subscribers</div></div>
        <div class="stat"><div class="n">${num(st.views)}</div><div class="l">Views</div></div>
        <div class="stat"><div class="n">${num(Math.round(st.avg_views||0))}</div><div class="l">Avg per video</div></div>
        <div class="stat"><div class="n">${num(st.likes)}</div><div class="l">Likes</div></div>
      </div>
      ${st.top ? `<div class="top">🏆 Top video: <b>${esc(st.top)}</b></div>` : ""}
      ${charts(stats.history, a.id)}` : "";
    return `<article class="agent">
      <div class="agent-top">
        <div><h2>${esc(a.name)}</h2>
          <div class="meta"><span class="mono">${esc(a.id)}</span><span>${esc((a.platforms||[]).join(" + "))}</span>
          <span>Last run ${esc(ago(a.last_run))}</span><span>${esc(a.schedule||"")}</span></div>
          ${ch.title ? `<div class="chan">Channel: <a href="https://youtube.com/${esc(ch.handle || "channel/" + (st.channel_id||""))}" target="_blank" rel="noopener">${esc(ch.title)}</a></div>` : ""}</div>
        <span class="pill ${stateCls}">${esc(a.state||"idle")}</span>
      </div>
      ${a.state==="paused"?`<div class="err" style="margin-top:10px">Paused after ${a.consecutive_failures} failed runs. Fix the error below, then run the workflow with “force”.</div>`:""}
      ${statsBlock}
      <div class="strip">${days}</div>
      <div class="legend">Last ${Math.min(30,runs.length)} runs, oldest → newest</div>
      <div class="tablewrap"><table><thead><tr><th>When</th><th>Video</th><th>Result</th><th class="num">Views</th><th class="num hide-sm">Likes</th><th class="hide-sm">Link</th><th class="hide-sm">Length</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="7">No runs yet</td></tr>'}</tbody></table></div>
    </article>`;
  }).join("");
}

async function load(){
  const demo = new URLSearchParams(location.search).has("demo");
  if(demo){ render(DEMO,true,null); return; }
  let stats = null;
  try{
    const s = await fetch("analytics.json?t="+Date.now(), {cache:"no-store"});
    if(s.ok) stats = await s.json();
  }catch(e){ stats = null; }
  try{
    const r = await fetch("status.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    render(await r.json(), false, stats);
  }catch(e){ render(DEMO,true,null); }
}
setInterval(()=>{$("#clock").textContent=new Date().toLocaleString([], {weekday:"short",hour:"2-digit",minute:"2-digit"})},1000);
load(); setInterval(load, 60000);
</script>
</body>
</html>
